name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          black --check src tests scripts
      - name: Types
        run: mypy src/workbench
      - name: Unit tests
        run: pytest tests -q -m unit --cov=workbench --cov-report=xml --cov-fail-under=80

  isolation:
    name: tenant isolation (the important one)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbench_admin
          POSTGRES_PASSWORD: workbench_admin
          POSTGRES_DB: workbench
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench_admin -d workbench"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-secret-that-is-long-enough-to-be-valid-000000
      DATABASE_DSN: postgresql+asyncpg://workbench:workbench@localhost:5433/workbench
      DATABASE_ADMIN_DSN: postgresql+asyncpg://workbench_admin:workbench_admin@localhost:5433/workbench
      REDIS_DSN: redis://localhost:6380/0
      TEST_APP_DSN: postgresql+asyncpg://workbench:workbench@localhost:5433/workbench_test
      TEST_ADMIN_DSN: postgresql+asyncpg://workbench_admin:workbench_admin@localhost:5433/workbench_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Create the application role
        run: |
          PGPASSWORD=workbench_admin psql -h localhost -p 5433 -U workbench_admin -d workbench <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'workbench') THEN
                  CREATE ROLE workbench LOGIN PASSWORD 'workbench'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
              END IF;
          END
          $$;
          SELECT 'CREATE DATABASE workbench_test OWNER workbench_admin'
           WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'workbench_test') \gexec
          GRANT CONNECT ON DATABASE workbench TO workbench;
          GRANT CONNECT ON DATABASE workbench_test TO workbench;
          SQL

      - name: Migrate
        run: make migrate && make migrate-test-db

      - name: Audit row-level security
        run: make check-rls && make check-rls-test

      - name: Isolation suite
        run: pytest tests -q -m database -v

      - name: Dump the offending policies on failure
        if: failure()
        run: |
          PGPASSWORD=workbench_admin psql -h localhost -p 5433 -U workbench_admin -d workbench \
            -c "SELECT c.relname, c.relrowsecurity, c.relforcerowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r';" \
            -c "SELECT c.relname, p.polname, pg_get_expr(p.polqual, p.polrelid) FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid;"

  api:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: [isolation]
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-secret-that-is-long-enough-to-be-valid-000000
      DATABASE_DSN: postgresql+asyncpg://workbench:workbench@localhost:5433/workbench
      DATABASE_ADMIN_DSN: postgresql+asyncpg://workbench_admin:workbench_admin@localhost:5433/workbench
      REDIS_DSN: redis://localhost:6380/0
      BILLING_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbench_admin
          POSTGRES_PASSWORD: workbench_admin
          POSTGRES_DB: workbench
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench_admin -d workbench"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Create the application role and migrate
        run: |
          PGPASSWORD=workbench_admin psql -h localhost -p 5433 -U workbench_admin -d workbench <<'SQL'
          DO $$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'workbench') THEN
                  CREATE ROLE workbench LOGIN PASSWORD 'workbench'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
              END IF;
          END $$;
          GRANT CONNECT ON DATABASE workbench TO workbench;
          SQL
          make migrate
      - name: Start the API
        run: |
          cd src && uvicorn workbench.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ready && exit 0
            sleep 1
          done
          echo "API never became ready"; exit 1
      - name: End-to-end smoke test
        run: bash scripts/smoke.sh http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker logs $(docker ps -q) 2>&1 | tail -100 || true
